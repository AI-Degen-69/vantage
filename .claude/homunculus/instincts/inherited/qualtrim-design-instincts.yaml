# Qualtrim Design Workflow I18n Update And Ui Text Translation

## Action

Follow the i18n-update-and-ui-text-translation workflow:
1. Identify new or hardcoded UI strings in component and page files.
2. Update or add keys in translation files (client/locales/en/translation.json, client/locales/he/translation.json).
3. Refactor UI components/pages to use translation keys instead of hardcoded strings.
4. Optionally update mock data to reflect new/translated content.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: client/components/*.tsx, client/pages/*.tsx, client/locales/en/translation.json

