# Qualtrim Design Workflow Feature Development With Shared Ui And Api

## Action

Follow the feature-development-with-shared-ui-and-api workflow:
1. Implement or update UI components and pages.
2. Update or add shared logic (client/lib, shared/api.ts).
3. Update or add server routes and services.
4. Update translation files for new UI text.
5. Update documentation (e.g., endpoints.md, AGENTS.md).
6. Update package.json and lockfile if dependencies or project identity change.
7. Validate with tests and smoke scripts.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: client/components/*.tsx, client/pages/*.tsx, client/lib/*.ts

